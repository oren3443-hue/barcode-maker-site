<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מחולל ברקודים</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Heebo', 'Rubik', 'Arial Hebrew', sans-serif;
    background: #f5f5f0;
    margin: 0;
    padding: 24px;
    color: #1a1a1a;
  }
  .container { max-width: 980px; margin: 0 auto; }
  .header {
    background: white;
    border-radius: 12px;
    padding: 24px 28px;
    margin-bottom: 16px;
    border: 1px solid #e5e5e0;
  }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
  .sub { color: #6a6a65; font-size: 14px; }
  .panel {
    background: white;
    border-radius: 12px;
    padding: 24px 28px;
    margin-bottom: 16px;
    border: 1px solid #e5e5e0;
  }
  .step-label {
    display: inline-block;
    background: #1a1a1a;
    color: white;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    text-align: center;
    line-height: 24px;
    font-size: 13px;
    margin-left: 8px;
  }
  .step-title { font-size: 16px; font-weight: 500; margin-bottom: 16px; display: flex; align-items: center; }
  .drop {
    border: 2px dashed #c5c5c0;
    border-radius: 12px;
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    transition: all .2s;
    background: #fafaf7;
  }
  .drop:hover, .drop.dragover { border-color: #1a1a1a; background: #f0f0e8; }
  .drop .big { font-size: 16px; font-weight: 500; }
  .drop .small { font-size: 13px; color: #6a6a65; margin-top: 6px; }
  input[type=file] { display: none; }
  .file-name { margin-top: 12px; font-size: 14px; color: #2a6b3a; font-weight: 500; }
  .row { display: grid; gap: 12px; margin-bottom: 12px; }
  .row-2 { grid-template-columns: 1fr 1fr; }
  .row-3 { grid-template-columns: 1fr 1fr 1fr; }
  label { display: block; font-size: 13px; color: #6a6a65; margin-bottom: 4px; }
  select, input[type=number], input[type=text] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #d5d5d0;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: white;
  }
  button {
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid #1a1a1a;
    background: #1a1a1a;
    color: white;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: #2a2a2a; }
  button.ghost { background: white; color: #1a1a1a; }
  button.ghost:hover { background: #f0f0e8; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .grid {
    display: grid;
    gap: 8px;
    margin-top: 12px;
  }
  .cell {
    border: 1px solid #d5d5d0;
    border-radius: 8px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: white;
    page-break-inside: avoid;
    min-height: 130px;
    justify-content: center;
    gap: 4px;
  }
  .cell .name {
    font-size: 12px;
    font-weight: 500;
    text-align: center;
    line-height: 1.3;
    width: 100%;
    word-wrap: break-word;
  }
  .cell svg { max-width: 100%; height: auto; display: block; }
  .cell .code { font-size: 11px; color: #444; font-family: monospace; margin-top: -2px; }
  .actions { display: flex; gap: 10px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  .actions-divider { width: 1px; align-self: stretch; background: #e5e5e0; margin: 0 4px; }
  .export-status { font-size: 13px; color: #2a6b3a; font-weight: 500; margin-right: 6px; }
  .export-status.error { color: #a33; }
  .hidden { display: none; }
  .hint { font-size: 12px; color: #8a8a85; margin-top: 4px; }
  .page {
    background: white;
    padding: 12mm;
    box-shadow: 0 0 0 1px #e5e5e0;
    margin: 0 auto;
  }
  .page + .page { margin-top: 14px; }
  #pdf-area { padding: 14px; background: #ececec; border-radius: 12px; }
  .summary { font-size: 13px; color: #444; margin: 8px 0 0; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>מחולל ברקודים מאקסל</h1>
    <div class="sub">מעלים קובץ Excel עם שמות פריטים וקודים — מקבלים PDF להדפסה עם ברקודים מסודרים.</div>
  </div>

  <div class="panel">
    <div class="step-title"><span class="step-label">1</span> העלאת קובץ</div>
    <div class="drop" id="drop">
      <div class="big">גרור לכאן קובץ Excel או לחץ לבחירה</div>
      <div class="small">פורמטים נתמכים: .xlsx, .xls, .csv</div>
    </div>
    <input type="file" id="file" accept=".xlsx,.xls,.csv">
    <div id="file-name" class="file-name hidden"></div>
  </div>

  <div class="panel hidden" id="map-panel">
    <div class="step-title"><span class="step-label">2</span> זיהוי עמודות</div>
    <div class="row row-3">
      <div>
        <label>גיליון</label>
        <select id="sheet"></select>
      </div>
      <div>
        <label>עמודת שם המוצר</label>
        <select id="col-name"></select>
      </div>
      <div>
        <label>עמודת ערך הברקוד</label>
        <select id="col-code"></select>
      </div>
    </div>
    <div class="row row-2">
      <div>
        <label>שורת כותרת (אם יש)</label>
        <select id="header-row"></select>
        <div class="hint">השורה שמכילה את שמות העמודות — נדלג עליה.</div>
      </div>
      <div>
        <label>סוג ברקוד</label>
        <select id="bc-format">
          <option value="CODE128" selected>Code128 (מומלץ)</option>
          <option value="CODE39">Code39</option>
          <option value="EAN13">EAN-13</option>
          <option value="EAN8">EAN-8</option>
          <option value="UPC">UPC</option>
        </select>
      </div>
    </div>
    <div class="row row-3">
      <div>
        <label>ברקודים בשורה</label>
        <select id="cols">
          <option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option>
        </select>
      </div>
      <div>
        <label>שורות בעמוד</label>
        <select id="rows">
          <option>4</option><option>5</option><option selected>6</option><option>7</option><option>8</option><option>10</option>
        </select>
      </div>
      <div>
        <label>גובה ברקוד</label>
        <select id="bc-height">
          <option value="30">נמוך</option>
          <option value="40" selected>בינוני</option>
          <option value="55">גבוה</option>
        </select>
      </div>
    </div>
    <div class="row row-2">
      <div>
        <label>שם הקובץ להורדה</label>
        <input type="text" id="out-name" placeholder="ברקודים">
        <div class="hint">הסיומת <span style="font-family: monospace; direction: ltr;">.pdf</span> תתווסף אוטומטית.</div>
      </div>
      <div>
        <label>תוסיף תאריך לשם?</label>
        <select id="add-date">
          <option value="1" selected>כן — ‎2026-05-19 בסוף השם</option>
          <option value="0">לא</option>
        </select>
      </div>
    </div>
    <div class="actions">
      <button id="build">צור תצוגה מקדימה</button>
      <span class="summary" id="summary"></span>
    </div>
  </div>

<div class="panel hidden" id="preview-panel">
    <div class="step-title"><span class="step-label">3</span> תצוגה מקדימה ויצוא</div>
    <div class="actions">
      <button id="download">הורד PDF להדפסה</button>
      <button class="ghost" id="print">הדפס</button>
      <span class="actions-divider"></span>
      <button class="ghost" id="download-assets-pdf">PDF — דף לכל ברקוד</button>
      <button class="ghost" id="download-svg">SVG — קיט אחד</button>
      <span class="export-status" id="export-status"></span>
    </div>
    <div id="pdf-area"></div>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);
let workbook = null;
let currentSheetData = null;

// File upload
const drop = $('drop');
const fileInput = $('file');
drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('dragover'); });
drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
drop.addEventListener('drop', e => {
  e.preventDefault();
  drop.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
  if (e.target.files.length) handleFile(e.target.files[0]);
});

function handleFile(file) {
  $('file-name').textContent = 'נבחר: ' + file.name;
  $('file-name').classList.remove('hidden');
  // Auto-fill output filename from source
  const baseName = file.name.replace(/\.[^.]+$/, '').trim();
  const suggested = baseName ? `${baseName} - ברקודים` : 'ברקודים';
  $('out-name').value = suggested;
  const reader = new FileReader();
  reader.onload = e => {
    const data = new Uint8Array(e.target.result);
    workbook = XLSX.read(data, { type: 'array' });
    populateSheetSelector();
    $('map-panel').classList.remove('hidden');
  };
  reader.readAsArrayBuffer(file);
}

function populateSheetSelector() {
  const sel = $('sheet');
  sel.innerHTML = '';
  workbook.SheetNames.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    sel.appendChild(opt);
  });
  sel.onchange = onSheetChange;
  onSheetChange();
}

function onSheetChange() {
  const name = $('sheet').value;
  const ws = workbook.Sheets[name];
  currentSheetData = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
  // Populate header row selector with up to first 10 rows
  const hr = $('header-row');
  hr.innerHTML = '<option value="-1">אין כותרת — השתמש בכל השורות</option>';
  const limit = Math.min(10, currentSheetData.length);
  for (let i = 0; i < limit; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `שורה ${i + 1}: ${(currentSheetData[i] || []).slice(0, 4).map(v => v == null ? '' : String(v)).join(' | ').substr(0, 60)}`;
    hr.appendChild(opt);
  }
  hr.value = guessHeaderRow();
  hr.onchange = populateColumnSelectors;
  populateColumnSelectors();
}

function guessHeaderRow() {
  // Pick the row with the most non-empty string cells in the first 10 rows
  let best = -1, bestScore = 0;
  for (let i = 0; i < Math.min(10, currentSheetData.length); i++) {
    const row = currentSheetData[i] || [];
    const score = row.filter(v => typeof v === 'string' && v.trim()).length;
    if (score > bestScore) { bestScore = score; best = i; }
  }
  return best;
}

function populateColumnSelectors() {
  const hr = parseInt($('header-row').value);
  const headerRow = hr >= 0 ? currentSheetData[hr] || [] : [];
  // Determine column count by scanning all rows
  let maxCols = 0;
  currentSheetData.forEach(r => { if (r && r.length > maxCols) maxCols = r.length; });
  const nameSel = $('col-name');
  const codeSel = $('col-code');
  nameSel.innerHTML = '';
  codeSel.innerHTML = '';
  for (let c = 0; c < maxCols; c++) {
    const label = headerRow[c] != null && String(headerRow[c]).trim() ? String(headerRow[c]) : `עמודה ${c + 1}`;
    [nameSel, codeSel].forEach(sel => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = label;
      sel.appendChild(opt);
    });
  }
  // Guess columns: pick the col with longest avg strings for name, the col with most numbers/short codes for code
  const colStats = [];
  for (let c = 0; c < maxCols; c++) {
    let textLen = 0, textCount = 0, numCount = 0;
    currentSheetData.forEach((r, i) => {
      if (hr >= 0 && i <= hr) return;
      const v = r ? r[c] : null;
      if (v == null) return;
      const s = String(v).trim();
      if (!s) return;
      if (/^\d+$/.test(s) || typeof v === 'number') numCount++;
      textLen += s.length;
      textCount++;
    });
    colStats.push({ c, textLen, textCount, numCount, avg: textCount ? textLen / textCount : 0 });
  }
  // Name = highest avg string length
  const nameGuess = colStats.slice().sort((a, b) => b.avg - a.avg)[0];
  // Code = highest numCount, prefer different from name
  const codeGuess = colStats.slice().sort((a, b) => b.numCount - a.numCount).find(s => s.c !== (nameGuess && nameGuess.c)) || colStats[0];
  if (nameGuess) nameSel.value = nameGuess.c;
  if (codeGuess) codeSel.value = codeGuess.c;
  updateSummary();
  ['col-name', 'col-code'].forEach(id => $(id).onchange = updateSummary);
}

function getItems() {
  const hr = parseInt($('header-row').value);
  const nameCol = parseInt($('col-name').value);
  const codeCol = parseInt($('col-code').value);
  const items = [];
  currentSheetData.forEach((r, i) => {
    if (!r) return;
    if (hr >= 0 && i <= hr) return;
    const name = r[nameCol];
    const code = r[codeCol];
    if (name == null && code == null) return;
    const nameS = name != null ? String(name).trim() : '';
    const codeS = code != null ? String(code).trim() : '';
    if (!codeS) return;
    items.push({ name: nameS, code: codeS });
  });
  return items;
}

function updateSummary() {
  const items = getItems();
  $('summary').textContent = `${items.length} פריטים יוכנסו לקובץ`;
}

$('build').onclick = build;

function build() {
  const items = getItems();
  if (!items.length) {
    alert('לא נמצאו פריטים. בדוק את הגדרות העמודות.');
    return;
  }
  const cols = parseInt($('cols').value);
  const rowsPerPage = parseInt($('rows').value);
  const perPage = cols * rowsPerPage;
  const format = $('bc-format').value;
  const bcH = parseInt($('bc-height').value);

  const area = $('pdf-area');
  area.innerHTML = '';
  for (let i = 0; i < items.length; i += perPage) {
    const page = document.createElement('div');
    page.className = 'page';
    page.style.width = '210mm';
    page.style.minHeight = '297mm';
    const grid = document.createElement('div');
    grid.className = 'grid';
    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    grid.style.gridTemplateRows = `repeat(${rowsPerPage}, minmax(0, 1fr))`;
    grid.style.height = `${297 - 24}mm`;
    page.appendChild(grid);

    for (let j = 0; j < perPage && (i + j) < items.length; j++) {
      const it = items[i + j];
      const cell = document.createElement('div');
      cell.className = 'cell';

      const nm = document.createElement('div');
      nm.className = 'name';
      nm.textContent = it.name || ' ';
      cell.appendChild(nm);

      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      cell.appendChild(svg);
      try {
        JsBarcode(svg, it.code, {
          format,
          height: bcH,
          width: 1.6,
          margin: 0,
          displayValue: false
        });
      } catch (e) {
        cell.innerHTML += `<div style="color:#a33;font-size:11px">לא נוצר: ${e.message}</div>`;
      }
      const codeEl = document.createElement('div');
      codeEl.className = 'code';
      codeEl.textContent = it.code;
      cell.appendChild(codeEl);

      grid.appendChild(cell);
    }
    area.appendChild(page);
  }

  $('preview-panel').classList.remove('hidden');
  $('preview-panel').scrollIntoView({ behavior: 'smooth' });
}

function buildFilename() {
  let base = ($('out-name').value || '').trim();
  if (!base) base = 'ברקודים';
  // Strip a user-typed .pdf if present
  base = base.replace(/\.pdf$/i, '');
  if ($('add-date').value === '1') {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    base += ` ${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  // Remove characters that some OSes dislike in filenames
  base = base.replace(/[\/\\:*?"<>|]/g, '-');
  return base + '.pdf';
}

function setStatus(text, isError) {
  const el = $('export-status');
  el.textContent = text || '';
  el.classList.toggle('error', !!isError);
}

function nextFrame() {
  return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
}

$('download').onclick = async () => {
  const area = $('pdf-area');
  const pages = area.querySelectorAll('.page');
  if (!pages.length) return;

  const btn = $('download');
  const origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'מייצר PDF...';
  setStatus('');

  try {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });

    for (let i = 0; i < pages.length; i++) {
      setStatus(`מייצר עמוד ${i + 1} מתוך ${pages.length}…`);
      await nextFrame();

      const page = pages[i];
      const origShadow = page.style.boxShadow;
      page.style.boxShadow = 'none';

      const canvas = await html2canvas(page, {
        scale: 3,
        useCORS: true,
        backgroundColor: '#ffffff'
      });

      page.style.boxShadow = origShadow;

      if (i > 0) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 210, 297);
    }

    pdf.save(buildFilename());
    setStatus(`✓ נוצר PDF עם ${pages.length} עמודים`);
  } catch (e) {
    setStatus(`שגיאה: ${e.message}`, true);
  } finally {
    btn.disabled = false;
    btn.textContent = origText;
  }
};

$('print').onclick = () => {
  window.print();
};

function buildAssetFilename(ext, suffix) {
  let base = ($('out-name').value || '').trim();
  if (!base) base = 'ברקודים';
  base = base.replace(/\.(pdf|svg|zip)$/i, '');
  if ($('add-date').value === '1') {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    base += ` ${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  base = base.replace(/[\/\\:*?"<>|]/g, '-');
  if (suffix) base += ` ${suffix}`;
  return base + '.' + ext;
}

function sanitizeForSvgId(s, idx) {
  const cleaned = String(s || '').trim()
    .replace(/\s+/g, '-')
    .replace(/[^\p{L}\p{N}_-]/gu, '');
  const base = cleaned || `item`;
  const safe = /^[\p{L}_]/u.test(base) ? base : `item-${base}`;
  return `${safe}--${idx + 1}`;
}

$('download-assets-pdf').onclick = async () => {
  const items = getItems();
  if (!items.length) {
    alert('לא נמצאו פריטים.');
    return;
  }
  const format = $('bc-format').value;
  const btn = $('download-assets-pdf');
  const origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'מייצר PDF...';
  setStatus('');

  const sandbox = document.createElement('div');
  sandbox.style.position = 'absolute';
  sandbox.style.left = '-99999px';
  sandbox.style.top = '0';
  sandbox.style.background = 'white';
  document.body.appendChild(sandbox);

  try {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'mm', format: 'a6', orientation: 'landscape' });

    for (let i = 0; i < items.length; i++) {
      setStatus(`מייצר ברקוד ${i + 1} מתוך ${items.length}…`);
      await nextFrame();
      const item = items[i];

      const page = document.createElement('div');
      page.style.width = '148mm';
      page.style.height = '105mm';
      page.style.background = 'white';
      page.style.display = 'flex';
      page.style.flexDirection = 'column';
      page.style.alignItems = 'center';
      page.style.justifyContent = 'center';
      page.style.padding = '10mm';
      page.style.boxSizing = 'border-box';
      page.style.gap = '6mm';
      page.style.fontFamily = "'Heebo', 'Rubik', 'Arial Hebrew', sans-serif";
      page.style.direction = 'rtl';

      if (item.name) {
        const nm = document.createElement('div');
        nm.textContent = item.name;
        nm.style.fontSize = '14pt';
        nm.style.fontWeight = '500';
        nm.style.textAlign = 'center';
        nm.style.color = '#1a1a1a';
        nm.style.maxWidth = '100%';
        nm.style.wordBreak = 'break-word';
        page.appendChild(nm);
      }

      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      page.appendChild(svg);
      let rendered = true;
      try {
        JsBarcode(svg, item.code, {
          format,
          height: 90,
          width: 2.6,
          margin: 0,
          displayValue: false
        });
        svg.style.maxWidth = '90%';
        svg.style.height = 'auto';
      } catch (e) {
        rendered = false;
        const err = document.createElement('div');
        err.textContent = `לא נוצר ברקוד: ${e.message}`;
        err.style.color = '#a33';
        err.style.fontSize = '11pt';
        page.appendChild(err);
      }

      const code = document.createElement('div');
      code.textContent = item.code;
      code.style.fontFamily = 'monospace';
      code.style.fontSize = '11pt';
      code.style.color = '#444';
      code.style.direction = 'ltr';
      page.appendChild(code);

      sandbox.appendChild(page);

      const canvas = await html2canvas(page, {
        scale: 3,
        useCORS: true,
        backgroundColor: '#ffffff'
      });

      if (i > 0) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 148, 105);

      sandbox.removeChild(page);
    }

    pdf.save(buildAssetFilename('pdf', '(אסטים)'));
    setStatus(`✓ נוצר PDF עם ${items.length} ברקודים (דף לכל אחד)`);
  } catch (e) {
    setStatus(`שגיאה: ${e.message}`, true);
  } finally {
    document.body.removeChild(sandbox);
    btn.disabled = false;
    btn.textContent = origText;
  }
};

$('download-svg').onclick = () => {
  const items = getItems();
  if (!items.length) {
    alert('לא נמצאו פריטים.');
    return;
  }
  const format = $('bc-format').value;
  const btn = $('download-svg');
  const origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'מייצר SVG...';
  setStatus(`מייצר SVG עם ${items.length} ברקודים…`);

  try {
    const NS = 'http://www.w3.org/2000/svg';
    const cols = 3;
    const cellW = 260;
    const cellH = 140;
    const padding = 24;
    const labelH = 18;

    const rows = Math.ceil(items.length / cols);
    const totalW = cols * cellW + padding * 2;
    const totalH = rows * cellH + padding * 2;

    const master = document.createElementNS(NS, 'svg');
    master.setAttribute('xmlns', NS);
    master.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
    master.setAttribute('width', totalW);
    master.setAttribute('height', totalH);
    master.setAttribute('viewBox', `0 0 ${totalW} ${totalH}`);

    const title = document.createElementNS(NS, 'title');
    title.textContent = ($('out-name').value || 'ברקודים') + ' — קיט';
    master.appendChild(title);

    const bg = document.createElementNS(NS, 'rect');
    bg.setAttribute('width', '100%');
    bg.setAttribute('height', '100%');
    bg.setAttribute('fill', '#ffffff');
    master.appendChild(bg);

    items.forEach((item, idx) => {
      const col = idx % cols;
      const row = Math.floor(idx / cols);
      const x = padding + col * cellW;
      const y = padding + row * cellH;

      const g = document.createElementNS(NS, 'g');
      g.setAttribute('id', sanitizeForSvgId(item.name || item.code, idx));
      g.setAttribute('transform', `translate(${x}, ${y})`);

      const gTitle = document.createElementNS(NS, 'title');
      gTitle.textContent = `${item.name || ''} — ${item.code}`.trim();
      g.appendChild(gTitle);

      if (item.name) {
        const label = document.createElementNS(NS, 'text');
        label.setAttribute('x', cellW / 2);
        label.setAttribute('y', 14);
        label.setAttribute('text-anchor', 'middle');
        label.setAttribute('font-family', 'Arial, Helvetica, sans-serif');
        label.setAttribute('font-size', '12');
        label.setAttribute('font-weight', '500');
        label.setAttribute('fill', '#1a1a1a');
        label.textContent = item.name;
        g.appendChild(label);
      }

      const tempSvg = document.createElementNS(NS, 'svg');
      try {
        JsBarcode(tempSvg, item.code, {
          format,
          height: 70,
          width: 2,
          margin: 0,
          displayValue: false
        });
        const bcW = parseFloat(tempSvg.getAttribute('width')) || cellW - 40;
        const bcH = parseFloat(tempSvg.getAttribute('height')) || 70;
        const scale = Math.min(1, (cellW - 30) / bcW);
        const drawnW = bcW * scale;
        const drawnH = bcH * scale;
        const bcX = (cellW - drawnW) / 2;
        const bcY = labelH + 8;

        const bcGroup = document.createElementNS(NS, 'g');
        bcGroup.setAttribute('class', 'barcode');
        bcGroup.setAttribute('transform', `translate(${bcX}, ${bcY}) scale(${scale})`);
        while (tempSvg.firstChild) {
          bcGroup.appendChild(tempSvg.firstChild);
        }
        g.appendChild(bcGroup);

        const codeText = document.createElementNS(NS, 'text');
        codeText.setAttribute('x', cellW / 2);
        codeText.setAttribute('y', bcY + drawnH + 14);
        codeText.setAttribute('text-anchor', 'middle');
        codeText.setAttribute('font-family', 'monospace');
        codeText.setAttribute('font-size', '11');
        codeText.setAttribute('fill', '#444');
        codeText.textContent = item.code;
        g.appendChild(codeText);
      } catch (e) {
        const err = document.createElementNS(NS, 'text');
        err.setAttribute('x', cellW / 2);
        err.setAttribute('y', cellH / 2);
        err.setAttribute('text-anchor', 'middle');
        err.setAttribute('fill', '#a33');
        err.setAttribute('font-size', '11');
        err.textContent = `שגיאה: ${item.code}`;
        g.appendChild(err);
      }

      master.appendChild(g);
    });

    const serializer = new XMLSerializer();
    const svgStr = '<?xml version="1.0" encoding="UTF-8"?>\n' + serializer.serializeToString(master);
    const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = buildAssetFilename('svg', '(קיט)');
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setStatus(`✓ נוצר SVG עם ${items.length} ברקודים (קבוצות נפרדות)`);
  } catch (e) {
    setStatus(`שגיאה: ${e.message}`, true);
  } finally {
    btn.disabled = false;
    btn.textContent = origText;
  }
};
</script>
